name: Spike
description: Indagine time-boxed per ridurre incertezza (versione semplificata)
title: "[Spike] "
type: Spike
labels: []
body:
  - type: textarea
    id: obiettivo
    attributes:
      label: Obiettivo dello spike
      description: Quale incertezza vogliamo risolvere? Perche indagare prima di procedere?
      placeholder: Descrivi l'obiettivo dell'indagine...
    validations:
      required: true

  - type: textarea
    id: domande
    attributes:
      label: Domande a cui rispondere
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: input
    id: timebox
    attributes:
      label: Timebox (durata massima)
      description: Tempo massimo dedicato allo spike.
      placeholder: es. 2 giorni
    validations:
      required: true
